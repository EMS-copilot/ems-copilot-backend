server:
  port: 8080

# 테스트용 GCP 더미 설정 (실제 호출하지 않음)
gcp:
  service-account:
    key-path: classpath:test-dummy-key.json
  vertex-ai:
    project-id: test-project-id
    location: test-location
    endpoint-id: test-endpoint-id
    endpoint-url: https://test-endpoint.com/predict

spring:
  # 테스트용 H2 인메모리 데이터베이스 사용
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop  # 테스트마다 스키마 재생성
    show_sql: false  # 테스트 시 SQL 로그 끄기
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

jwt:
  secret: ${JWT_SECRET:test-secret-key-for-testing-must-be-at-least-256-bits-long-for-security-purposes}
  expiration: ${JWT_EXPIRATION:3600000}
