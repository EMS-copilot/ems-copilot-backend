plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ems.copilot'
version = '0.0.1-SNAPSHOT'
description = 'ems-copilot-backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Google Cloud Libraries BOM (버전 관리)
	implementation platform('com.google.cloud:libraries-bom:26.50.0')

	// Google Auth 라이브러리 최신 버전 강제 (SecureSessionAgent 포함)
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.27.0'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Apache HttpClient 5 - 전체 의존성 추가
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.1'

	// Spring WebFlux (WebClient 사용)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Google Cloud Speech-to-Text - BOM이 버전 관리
	implementation 'com.google.cloud:google-cloud-speech'

	// Gson (JSON 처리)
	implementation 'com.google.code.gson:gson:2.11.0'

    // jwt
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'  // 테스트용 H2 인메모리 DB

    //jwt
	testImplementation 'org.springframework.security:spring-security-test'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
